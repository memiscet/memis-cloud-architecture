schema_version: '1.0'
deliverable_id: COPILOT-001
plan_version: '1'
source_deliverable:
  title: Expose the reusable workflow to GitHub Copilot
  deliverable_description: As a contributor, I want discoverable skills, explicit prompts, and a tutorial,
    so that I can continue the same file-based workflow in Copilot.
  acceptance_criteria:
  - id: COPILOT-001-AC1
    given: Canonical and generated skills exist
    when: The synchronization checker runs
    then: All seven generated skills match; a changed copy is rejected.
    type: negative
  - id: COPILOT-001-AC2
    given: A user chooses any of the seven workflow stages
    when: They inspect its prompt
    then: The prompt references the correct skill and requires an explicit project and, for delivery stages,
      a deliverable ID.
    type: positive
  - id: COPILOT-001-AC3
    given: Interactive Copilot is unavailable
    when: The contributor reads compatibility documentation
    then: Static checks and unperformed interactive tests are distinguished, and a manual discovery walkthrough
      is provided.
    type: edge_case
tasks:
- id: COPILOT-001-T1
  description: Add Copilot discovery, explicit stage prompts, scoped instructions, and synchronization checks.
  done_when: python scripts/sync_copilot.py --check, integration tests, and repository checks pass; inspect
    tutorial and unverified compatibility record.
